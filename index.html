<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Szprycha serwis rowerowy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <p class="logo">Szprycha</p>
        <nav class="menu">
            <a href="#uslugi">Usługi</a>
            <a href="#cennik">Cennik</a>
            <a href="#kontakt">Kontakt</a>
        </nav>
    </header>
    <main>
        <section id="uslugi">
            <div class="cards">
                <article class="card">
                    <h3>Przegląd</h3>
                    <p>Hamulce i przerzutki.</p>
                    <p class="card_price">od 120 zł</p>
                </article>
                <article class="card card--highlight">
                    <h3>Przegląd pełny</h3>
                    <p>Mycie i regulacja. Najczęściej wybierane.</p>
                    <p class="card_price">od 200 zł</p>
                </article>
                <article class="card">
                    <h3>Wymiana dętki</h3>
                    <p>Usługa na poczekaniu.</p>
                    <p class="card_price">od 40 zł</p>
                </article>
            </div>
        </section>
        <section id="cennik"></section>
    </main>
    <footer id="kontakt"></footer>
</body>
</html>
